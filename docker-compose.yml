services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: supportagent
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: supportagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      POSTGRES_USER: supportagent
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: supportagent
      POSTGRES_HOST: postgres
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_USER: supportagent
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: supportagent
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: support
      KEYCLOAK_CLIENT_ID: support-api
      KEYCLOAK_CLIENT_SECRET: changeme
      MCP_SERVER_URL: http://mcp:8000
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-support-agent}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://api:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: support
      KEYCLOAK_CLIENT_ID: support-frontend
      KEYCLOAK_CLIENT_SECRET: changeme-frontend
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
